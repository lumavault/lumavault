# Shared local PostgreSQL for the API schemas, plus Mailpit for local email.
# Credentials default to local-dev values; override them in a gitignored .env file.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lumavault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumavault}
      POSTGRES_DB: ${POSTGRES_DB:-lumavault}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Local fake mail server. Point the API at it with SMTP_URL=smtp://localhost:1025 and read
  # every sent email in the web inbox at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.34
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
