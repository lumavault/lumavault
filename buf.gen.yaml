# TypeScript and Swift stubs for every proto. Go stubs come from buf.gen.go.yaml, which is
# limited to proto/lumavault/v1.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/lumavault/lumavault/core/gen/go
plugins:
  # Web / TypeScript Protobuf v2 & Connect-ES service descriptors
  - remote: buf.build/bufbuild/es
    out: sdk/web/src/gen
    opt:
      - target=ts

  # Swift Protobuf & Connect-Swift client stubs
  - remote: buf.build/apple/swift
    out: sdk/swift/Sources/LumaVaultSDK/Gen
    opt:
      - Visibility=Public
  - remote: buf.build/connectrpc/swift
    out: sdk/swift/Sources/LumaVaultSDK/Gen
    opt:
      - Visibility=Public
