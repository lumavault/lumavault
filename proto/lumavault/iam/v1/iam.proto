syntax = "proto3";

package lumavault.iam.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

// IamService is the single front door for identity, households, quotas, Apple TV pairing,
// and upload tickets. It is served by apps/api, which calls Better Auth server-side, so
// clients never call Better Auth's household endpoints directly. Every byte count is
// 64-bit. Read-only calls are marked side-effect-free so browsers can send them as GET.
//
// A user belongs to at most one household. Moving to another household moves the user's
// private data with them and can copy shared items they choose. A user removed from a
// household keeps read-only access to their private data for a grace period, then it is
// deleted. Each app decides what is private and what is shared; IAM only moves it.
service IamService {
  // Setup and viewer context.

  // Reports whether the instance still needs first-run setup. Callable without a session.
  rpc GetSetupStatus(GetSetupStatusRequest) returns (GetSetupStatusResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Creates the first account, makes it Super-Admin and the Owner of a new household, and
  // signs it in. Runs only while no Super-Admin exists.
  rpc CompleteSetup(CompleteSetupRequest) returns (CompleteSetupResponse);

  // Returns who is signed in, their household and role, its allowance and usage, and their
  // grace period if they were removed from a household.
  rpc GetViewer(GetViewerRequest) returns (GetViewerResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Super-Admin controls.

  // Creates a single-use household creation invite for one email address with a preset
  // allowance, and emails the link.
  rpc CreateHouseholdInvite(CreateHouseholdInviteRequest) returns (CreateHouseholdInviteResponse);

  // Lists household creation invites that are not yet redeemed, revoked, or expired.
  rpc ListHouseholdInvites(ListHouseholdInvitesRequest) returns (ListHouseholdInvitesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc RevokeHouseholdInvite(RevokeHouseholdInviteRequest) returns (RevokeHouseholdInviteResponse);

  // Lists every household with its owner, allowance, usage, and member count.
  rpc ListHouseholds(ListHouseholdsRequest) returns (ListHouseholdsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Changes a household's storage cap, enabled apps, or member limit. Values below current
  // usage are allowed; they only block new uploads and invites.
  rpc UpdateHouseholdAllowance(UpdateHouseholdAllowanceRequest) returns (UpdateHouseholdAllowanceResponse);

  // Lists accounts on the instance, optionally filtered by name or email.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Invites and joining a household.

  // Describes an invite before it is used: who sent it, which household, and, when the
  // caller already belongs to a household, what moving would involve. Works signed out
  // too, so the invite page can show who the invite is from before sign-up.
  rpc GetInvite(GetInviteRequest) returns (GetInviteResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Lists the shared items in the caller's current household that they may copy when they
  // move. Every app contributes its own items; private data always moves and is not listed.
  rpc ListCopyableItems(ListCopyableItemsRequest) returns (ListCopyableItemsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Uses an invite. A new person invited as a member joins automatically when they sign up,
  // so this is for household creation invites and for people who already have an account.
  // A caller in another household moves: their private data goes with them, the chosen
  // shared items are copied, and an Owner leaving others behind names the next Owner.
  rpc JoinHousehold(JoinHouseholdRequest) returns (JoinHouseholdResponse);

  // Household members. These act on the caller's own household.

  // Lists the household's members, pending member invites, and free seats.
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Invites someone by email as an Admin or Member, and emails the link. Pending invites
  // count toward the member limit. Admin or Owner only.
  rpc InviteMember(InviteMemberRequest) returns (InviteMemberResponse);

  rpc CancelMemberInvite(CancelMemberInviteRequest) returns (CancelMemberInviteResponse);

  // Removes a member, who keeps read-only access to their private data for the grace
  // period. The Owner cannot be removed. Admin or Owner only.
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);

  // Makes a member an Admin or a Member. The Owner's role changes only through
  // TransferOwnership. Admin or Owner only.
  rpc UpdateMemberRole(UpdateMemberRoleRequest) returns (UpdateMemberRoleResponse);

  // Hands the Owner role to another member, who must already belong to the household. The
  // previous Owner becomes an Admin. Owner only.
  rpc TransferOwnership(TransferOwnershipRequest) returns (TransferOwnershipResponse);

  // Leaves the household without joining another, starting the grace period. An Owner
  // leaving others behind names the next Owner; a sole member closes the household.
  rpc LeaveHousehold(LeaveHouseholdRequest) returns (LeaveHouseholdResponse);

  // Apple TV pairing.

  // Called by the Apple TV without a session. Returns a short code to show on screen and a
  // device secret that only the Apple TV keeps.
  rpc StartPairing(StartPairingRequest) returns (StartPairingResponse);

  // Called by a signed-in user on their phone to approve the code shown on the Apple TV.
  // The Apple TV opens in the approver's household.
  rpc ApprovePairing(ApprovePairingRequest) returns (ApprovePairingResponse);

  // Polled by the Apple TV. Returns the bearer session token exactly once after approval.
  rpc PollPairing(PollPairingRequest) returns (PollPairingResponse);

  // Uploads.

  // Reserves bytes against the caller's household quota and returns a signed upload ticket
  // for the Storage Gateway. The app's own finish call claims the object and refunds the rest.
  rpc PrepareUpload(PrepareUploadRequest) returns (PrepareUploadResponse);

  // Releases a reservation that will not be finished.
  rpc CancelUpload(CancelUploadRequest) returns (CancelUploadResponse);
}

// App is one of the three media apps a household can have enabled.
enum App {
  APP_UNSPECIFIED = 0;
  APP_PHOTOS = 1;
  APP_CINEMA = 2;
  APP_ARCADE = 3;
}

// Role is a member's role in their household. Each household has exactly one Owner, who has
// every Admin power and cannot be removed. Super-Admin is a flag on the user, not a role.
enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_OWNER = 1;
  ROLE_ADMIN = 2;
  ROLE_MEMBER = 3;
}

message User {
  string id = 1;
  string name = 2;
  string email = 3;
  string image_url = 4;
  bool is_super_admin = 5;
  reserved 6, 7;
  reserved "banned", "ban_reason";
  google.protobuf.Timestamp created_at = 8;
}

// Allowance is what the Super-Admin grants a household.
message Allowance {
  uint64 storage_cap_bytes = 1;
  repeated App enabled_apps = 2;
  uint32 member_limit = 3;
}

// Usage is the household's current storage accounting. Reserved bytes belong to uploads
// that are prepared but not finished. Held bytes belong to removed members in their grace
// period and still count against the cap. Remaining bytes never go below zero.
message Usage {
  uint64 used_bytes = 1;
  uint64 reserved_bytes = 2;
  uint64 remaining_bytes = 3;
  uint64 held_bytes = 4;
}

message Household {
  string id = 1;
  string name = 2;
  reserved 3;
  reserved "suspended";
  Allowance allowance = 4;
  string owner_user_id = 5;
  google.protobuf.Timestamp created_at = 6;
}

// GracePeriod describes a user removed from a household. Until delete_at they can sign in
// and read or download their private data; joining a household moves it there.
message GracePeriod {
  string former_household_name = 1;
  uint64 private_bytes = 2;
  google.protobuf.Timestamp delete_at = 3;
}

message GetSetupStatusRequest {}

message GetSetupStatusResponse {
  bool needs_setup = 1;
  // True when the server only accepts one preset admin email for setup.
  bool admin_email_required = 2;
}

message CompleteSetupRequest {
  string name = 1;
  string email = 2;
  string password = 3;
  string household_name = 4;
}

message CompleteSetupResponse {
  User user = 1;
  Household household = 2;
}

message GetViewerRequest {}

message GetViewerResponse {
  User user = 1;
  // Unset when the viewer belongs to no household.
  Household household = 2;
  Role role = 3;
  // Usage of the viewer's household. Unset when there is no household.
  Usage usage = 4;
  // Set while the viewer is in a grace period after leaving or being removed.
  GracePeriod grace_period = 5;
}

message HouseholdInvite {
  string id = 1;
  // The only address that can use the invite.
  string email = 2;
  Allowance allowance = 3;
  // Optional note so the Super-Admin remembers who the invite is for.
  string note = 4;
  google.protobuf.Timestamp expires_at = 5;
  google.protobuf.Timestamp created_at = 6;
}

message CreateHouseholdInviteRequest {
  string email = 1;
  Allowance allowance = 2;
  string note = 3;
}

message CreateHouseholdInviteResponse {
  HouseholdInvite invite = 1;
  // The only time the invite link is returned. The server stores only its hash.
  string invite_url = 2;
}

message ListHouseholdInvitesRequest {}

message ListHouseholdInvitesResponse {
  repeated HouseholdInvite invites = 1;
}

message RevokeHouseholdInviteRequest {
  string invite_id = 1;
}

message RevokeHouseholdInviteResponse {}

message HouseholdSummary {
  Household household = 1;
  User owner = 2;
  Usage usage = 3;
  uint32 member_count = 4;
  uint32 pending_invite_count = 5;
}

message ListHouseholdsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListHouseholdsResponse {
  repeated HouseholdSummary households = 1;
  string next_page_token = 2;
}

message UpdateHouseholdAllowanceRequest {
  string household_id = 1;
  Allowance allowance = 2;
  // Paths: storage_cap_bytes, enabled_apps, member_limit.
  google.protobuf.FieldMask update_mask = 3;
}

message UpdateHouseholdAllowanceResponse {
  Household household = 1;
}

message ListUsersRequest {
  // Matches name or email, case-insensitively. Empty lists everyone.
  string query = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListUsersResponse {
  repeated User users = 1;
  string next_page_token = 2;
}

// InviteRef names an invite by what its link carries.
message InviteRef {
  oneof invite {
    // The secret from a household creation invite link.
    string household_invite_token = 1;
    // The ID from a member invite link.
    string member_invite_id = 2;
  }
}

enum InviteKind {
  INVITE_KIND_UNSPECIFIED = 0;
  // From the Super-Admin: the invitee creates a new household and becomes its Owner.
  INVITE_KIND_NEW_HOUSEHOLD = 1;
  // From a household Admin or Owner: the invitee joins that household.
  INVITE_KIND_MEMBER = 2;
}

// Move describes what using an invite means for a caller who already belongs to a household.
message Move {
  Household current_household = 1;
  // Private data that always moves with the caller.
  uint64 private_bytes = 2;
  // True when the caller is the Owner and others remain, so they must name the next Owner.
  bool must_choose_next_owner = 3;
  // Members who could become the next Owner.
  repeated Member next_owner_candidates = 4;
  // True when the caller is the only member, so their current household closes.
  bool closes_current_household = 5;
}

message GetInviteRequest {
  InviteRef invite = 1;
}

message GetInviteResponse {
  InviteKind kind = 1;
  string email = 2;
  string inviter_name = 3;
  // The household to join. Empty for a new household invite.
  string household_name = 4;
  // The role to join with. Owner for a new household invite.
  Role role = 5;
  google.protobuf.Timestamp expires_at = 6;
  // Set when the caller is signed in and already belongs to a household.
  Move move = 7;
}

// ItemRef names one app-owned shared item, such as a Photos album or a Cinema movie. The
// app defines kind and id.
message ItemRef {
  App app = 1;
  string kind = 2;
  string id = 3;
}

message CopyableItem {
  ItemRef ref = 1;
  string name = 2;
  uint64 size_bytes = 3;
  // True when the caller uploaded it. Items others uploaded can be copied too.
  bool uploaded_by_caller = 4;
}

message ListCopyableItemsRequest {
  // Optional filter to one app.
  App app = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListCopyableItemsResponse {
  repeated CopyableItem items = 1;
  string next_page_token = 2;
}

message JoinHouseholdRequest {
  InviteRef invite = 1;
  // Required for a new household invite: the new household's name.
  string household_name = 2;
  // Shared items to copy from the current household. The current household keeps its own
  // copy, and the copies count against the new household's quota.
  repeated ItemRef copy_items = 3;
  // Required when the caller owns their current household and others remain.
  string next_owner_user_id = 4;
}

message JoinHouseholdResponse {
  Household household = 1;
}

message Member {
  User user = 1;
  Role role = 2;
  google.protobuf.Timestamp joined_at = 3;
}

message MemberInvite {
  string id = 1;
  string email = 2;
  Role role = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message ListMembersRequest {}

message ListMembersResponse {
  repeated Member members = 1;
  repeated MemberInvite pending_invites = 2;
  // Seats left under the member limit after members and pending invites. Never below zero.
  uint32 seats_remaining = 3;
}

message InviteMemberRequest {
  string email = 1;
  // ROLE_ADMIN or ROLE_MEMBER.
  Role role = 2;
}

message InviteMemberResponse {
  MemberInvite invite = 1;
  // A copyable link to the same invite, also sent by email.
  string invite_url = 2;
}

message CancelMemberInviteRequest {
  string invite_id = 1;
}

message CancelMemberInviteResponse {}

message RemoveMemberRequest {
  string user_id = 1;
}

message RemoveMemberResponse {}

message UpdateMemberRoleRequest {
  string user_id = 1;
  // ROLE_ADMIN or ROLE_MEMBER.
  Role role = 2;
}

message UpdateMemberRoleResponse {
  Member member = 1;
}

message TransferOwnershipRequest {
  string user_id = 1;
}

message TransferOwnershipResponse {}

message LeaveHouseholdRequest {
  // Required when the caller is the Owner and others remain.
  string next_owner_user_id = 1;
}

message LeaveHouseholdResponse {}

message StartPairingRequest {
  // Shown to the approver, for example "Living Room".
  string device_name = 1;
}

message StartPairingResponse {
  string pairing_id = 1;
  // Six characters to show on screen.
  string code = 2;
  // Kept only on the Apple TV and sent with each poll.
  string device_secret = 3;
  google.protobuf.Timestamp expires_at = 4;
  uint32 poll_interval_seconds = 5;
}

message ApprovePairingRequest {
  string code = 1;
}

message ApprovePairingResponse {
  string device_name = 1;
}

enum PairingStatus {
  PAIRING_STATUS_UNSPECIFIED = 0;
  PAIRING_STATUS_PENDING = 1;
  PAIRING_STATUS_APPROVED = 2;
  PAIRING_STATUS_EXPIRED = 3;
}

message PollPairingRequest {
  string pairing_id = 1;
  string device_secret = 2;
}

message PollPairingResponse {
  PairingStatus status = 1;
  // Set only on the one poll that returns APPROVED.
  string session_token = 2;
}

message PrepareUploadRequest {
  App app = 1;
  uint64 size_bytes = 2;
  // Upload to the instance-wide Cinema or Arcade library instead of the caller's household.
  // Super-Admin only, and billed to no household.
  bool shared_library = 3;
}

message PrepareUploadResponse {
  string reservation_id = 1;
  // Storage ticket for HasChunks, chunk uploads, and CommitObject on the Gateway.
  string upload_ticket = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message CancelUploadRequest {
  string reservation_id = 1;
}

message CancelUploadResponse {}
