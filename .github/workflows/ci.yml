name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Buf, Go & JavaScript workspace
    runs-on: ubuntu-latest
    services:
      # API tests each run in their own throwaway schemas on this database.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lumavault
          POSTGRES_PASSWORD: lumavault
          POSTGRES_DB: lumavault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumavault -d lumavault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://lumavault:lumavault@localhost:5432/lumavault
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Generate Protobuf stubs
        run: make proto

      - name: Lint
        run: make lint-go lint-js

      - name: Test
        run: make test-go test-js

      - name: Build
        run: |
          go build -o bin/lumavault ./cmd/lumavault
          pnpm -r --if-present run build

  e2e:
    name: Portal end to end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lumavault
          POSTGRES_PASSWORD: lumavault
          POSTGRES_DB: lumavault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumavault -d lumavault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://lumavault:lumavault@localhost:5432/lumavault
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Generate Protobuf stubs
        run: make proto

      - name: Install Chromium
        run: pnpm install --frozen-lockfile && pnpm --filter @lumavault/portal exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: make e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/portal/test-results/

  swift:
    name: Swift SDK
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # The Swift integration tests build and run cmd/lumavault.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate Protobuf stubs
        run: make proto

      - name: Build and test Swift SDK
        run: make test-swift
