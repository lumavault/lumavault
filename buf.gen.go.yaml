# Go stubs for the Storage Core only. App and IAM protos are served by apps/api in Node,
# so they get no Go code. Run with: buf generate --template buf.gen.go.yaml --path proto/lumavault/v1
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/lumavault/lumavault/core/gen/go
plugins:
  - remote: buf.build/protocolbuffers/go
    out: core/gen/go
    opt:
      - paths=source_relative
  - remote: buf.build/connectrpc/go
    out: core/gen/go
    opt:
      - paths=source_relative
